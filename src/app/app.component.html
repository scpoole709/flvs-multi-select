<div style="display: flex;justify-content: space-around;padding: 2em; width: 60%; text-align: center;">

  <div>
    <multi-select [items]="testItems" [btnText]="'Select Columns'" (change)="onChange($event)"></multi-select>
  </div>

  <div style="display: flex; flex-direction: column;">
    <p *ngFor="let t of testItems">
      {{ t.value + ": " + t.checked }}
    </p>
  </div>
</div>

<button style="margin: 3em;">Post Test Button</button>
<!-- <img src="./assets/yellowstar.png"> -->

<ng-template #testtemplate>
  <div class="template-container">
    <span (click)="clicked()">This is a template with a couple of spans</span>
    <span>One span</span>
    <span>Two span</span>
    <span>Three span</span>
    <span>spagetti and meatballs</span>
  </div>
</ng-template>

<ng-template #temp>
  <div *ngIf="elementOverlayState1" style="width:100%; height: 100%; background-color: gray;"></div>
  <div *ngIf="!elementOverlayState1" style="width:15em; height: 2em; background-color: gray;"></div>
</ng-template>

<ng-template #temp2>
  <div *ngIf="elementOverlayState1" style="width:100%; height: 100%; background-color: red;"></div>
  <div *ngIf="!elementOverlayState1" style="width:15em; height: 2em; background-color: blue;"></div>
</ng-template>

<ng-template #temp3>
  <animated-cb [checked]="elementOverlayState1"></animated-cb>
</ng-template>

<ng-template #temp4>
  <graphic-cb [checked]="elementOverlayState1"></graphic-cb>
</ng-template>


<ng-template #temp5>
  <graphic-radio ></graphic-radio>
</ng-template>

<div style="margin-left:10em;">
  <pe-accessible-tree></pe-accessible-tree>
</div>
